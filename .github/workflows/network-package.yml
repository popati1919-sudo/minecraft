name: Package reseau complet Larpers Coin (Velocity + Lobby + SMP)

on:
  push:
    branches: [main, auth/velocity-replacement, ui/bedrock-friendly-menus]
    paths:
      - ".github/workflows/network-package.yml"
      - "plugin-source/**"
      - "velocity-plugin/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-network:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Compiler LarpersCoin
        working-directory: plugin-source
        run: gradle --no-daemon clean build

      - name: Telecharger Paper, Velocity et plugins
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarpersCoin-Network"
          mkdir -p "$ROOT/Velocity/plugins" "$ROOT/Lobby/plugins" "$ROOT/SMP/plugins"
          cp SUPERVISEUR-RESEAU.ps1 "$ROOT/SUPERVISEUR-RESEAU.ps1"
          cp PANEL-WEB-DISTANT.md "$ROOT/PANEL-WEB-DISTANT.md"
          cp DEMARRER-PANEL-DISTANT.bat "$ROOT/DEMARRER-PANEL-DISTANT.bat"
          cp DEMARRER-RESEAU.ps1 "$ROOT/DEMARRER-RESEAU.ps1"

          paper_meta="$(curl -fsSL -H 'User-Agent: LarpersCoin-Packager/1.0' "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds?channel=STABLE&limit=1")"
          paper_url="$(echo "$paper_meta" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$paper_url"
          curl -fL "$paper_url" -o "$ROOT/Lobby/paper.jar"
          cp "$ROOT/Lobby/paper.jar" "$ROOT/SMP/paper.jar"

          velocity_versions="$(curl -fsSL -H 'User-Agent: LarpersCoin-Packager/1.0' "https://fill.papermc.io/v3/projects/velocity")"
          velocity_version="$(echo "$velocity_versions" | jq -r '[.versions[][] | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')"
          test -n "$velocity_version"
          velocity_meta="$(curl -fsSL -H 'User-Agent: LarpersCoin-Packager/1.0' "https://fill.papermc.io/v3/projects/velocity/versions/$velocity_version/builds?channel=STABLE&limit=1")"
          velocity_url="$(echo "$velocity_meta" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$velocity_url"
          curl -fL "$velocity_url" -o "$ROOT/Velocity/velocity.jar"

          lp_meta="$(curl -fsSL https://metadata.luckperms.net/data/downloads)"
          lp_url="$(echo "$lp_meta" | jq -r '.downloads.bukkit // empty')"
          test -n "$lp_url"
          curl -fL "$lp_url" -o "$ROOT/SMP/plugins/LuckPerms.jar"

          plugin_jar="$(find plugin-source/build/libs -maxdepth 1 -type f -name 'LarpersCoin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$plugin_jar"
          cp "$plugin_jar" "$ROOT/SMP/plugins/LarpersCoin.jar"
          cp "$plugin_jar" "$ROOT/Lobby/plugins/LarpersCoin.jar"

          # Compagnon Velocity LPC (diagnostic du proxy).
          gradle --no-daemon -p velocity-plugin clean build
          velocity_plugin_jar="$(find velocity-plugin/build/libs -maxdepth 1 -type f -name 'LarpersCoinVelocity-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$velocity_plugin_jar"
          cp "$velocity_plugin_jar" "$ROOT/Velocity/plugins/LarpersCoinVelocity.jar"

          curl -fL "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity" -o "$ROOT/Velocity/plugins/Geyser-Velocity.jar"
          curl -fL "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity" -o "$ROOT/Velocity/plugins/floodgate-velocity.jar"
          # Floodgate doit aussi etre present sur les backends Paper pour que
          # l'API isFloodgatePlayer(UUID) reconnaisse les joueurs Bedrock au lobby.
          curl -fL "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -o "$ROOT/Lobby/plugins/floodgate-paper.jar"
          curl -fL "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -o "$ROOT/SMP/plugins/floodgate-paper.jar"
          test -s "$ROOT/Velocity/plugins/Geyser-Velocity.jar"
          test -s "$ROOT/Velocity/plugins/floodgate-velocity.jar"
          test -s "$ROOT/Lobby/plugins/floodgate-paper.jar"
          test -s "$ROOT/SMP/plugins/floodgate-paper.jar"

          # FastLoginPlus retire: aucune verification Mojang externe.

          papi_meta="$(curl -fsSL 'https://api.modrinth.com/v2/project/placeholderapi/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          papi_url="$(echo "$papi_meta" | jq -r '[.[] | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$papi_url"
          curl -fL "$papi_url" -o "$ROOT/Lobby/plugins/PlaceholderAPI.jar"
          cp "$ROOT/Lobby/plugins/PlaceholderAPI.jar" "$ROOT/SMP/plugins/PlaceholderAPI.jar"


          test -s "$ROOT/Lobby/plugins/PlaceholderAPI.jar"
          test -s "$ROOT/SMP/plugins/PlaceholderAPI.jar"

      - name: Configurer Velocity, lobby et SMP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarpersCoin-Network"
          SECRET="$(openssl rand -hex 32)"
          printf '%s' "$SECRET" > "$ROOT/Velocity/forwarding.secret"

          cat > "$ROOT/Velocity/velocity.toml" <<EOF
          config-version = "2.7"
          bind = "0.0.0.0:25565"
          motd = "<gold>Larpers Coin Network</gold>"
          show-max-players = 100
          online-mode = false
          force-key-authentication = false
          player-info-forwarding-mode = "modern"
          forwarding-secret-file = "forwarding.secret"
          announce-forge = false
          kick-existing-players = false
          ping-passthrough = "DISABLED"
          sample-players-in-ping = false
          enable-player-address-logging = true

          [servers]
          lobby = "127.0.0.1:25566"
          smp = "127.0.0.1:25567"
          try = ["lobby"]

          [forced-hosts]

          [advanced]
          compression-threshold = 256
          compression-level = -1
          login-ratelimit = 3000
          connection-timeout = 5000
          read-timeout = 30000
          haproxy-protocol = false
          tcp-fast-open = false
          bungee-plugin-message-channel = true
          show-ping-requests = false
          failover-on-unexpected-server-disconnect = true
          announce-proxy-commands = true
          log-command-executions = false
          log-player-connections = true
          accepts-transfers = false
          enable-reuse-port = false

          [query]
          enabled = false
          port = 25565
          map = "Velocity"
          show-plugins = false
          EOF

          for SERVER in Lobby SMP; do
            PORT=25566
            if [ "$SERVER" = "SMP" ]; then PORT=25567; fi
            cat > "$ROOT/$SERVER/eula.txt" <<'EOF'
          # EULA acceptee a la demande de l'administrateur. Conditions: https://aka.ms/MinecraftEULA
          eula=true
          EOF
            cat > "$ROOT/$SERVER/server.properties" <<EOF
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=false
          level-name=world
          gamemode=survival
          difficulty=normal
          hardcore=false
          max-players=100
          online-mode=false
          enforce-secure-profile=false
          pvp=false
          server-port=$PORT
          server-ip=127.0.0.1
          motd=Larpers Coin $SERVER
          view-distance=8
          simulation-distance=6
          spawn-protection=0
          allow-flight=true
          white-list=false
          EOF
            mkdir -p "$ROOT/$SERVER/config"
            cat > "$ROOT/$SERVER/config/paper-global.yml" <<EOF
          _version: 31
          proxies:
            velocity:
              enabled: true
              online-mode: false
              secret: "$SECRET"
          EOF
          done

          # Lobby entièrement vide: générateur sans blocs, spawn suspendu dans le vide.
          cat > "$ROOT/Lobby/bukkit.yml" <<'EOF'
          worlds:
            world:
              generator: LarpersCoin:empty
          EOF

          mkdir -p "$ROOT/SMP/plugins/LarpersCoin" "$ROOT/Lobby/plugins/LarpersCoin"
          cat > "$ROOT/Lobby/plugins/LarpersCoin/config.yml" <<'EOF'
          network:
            auth-only: true
          lobby-void:
            enabled: true
          auth:
            proxy-authenticated: false
            remember-ip: true
            connect-to-smp: true
          panel:
            enabled: false
          anticheat:
            enabled: false
          EOF
          cat > "$ROOT/SMP/plugins/LarpersCoin/config.yml" <<'EOF'
          auth:
            # Le SMP lit le même fichier que le Lobby pour /admin reset.
            storage-file: ../Lobby/plugins/LarpersCoin/auth.yml
            proxy-authenticated: true
            remember-ip: true
          panel:
            enabled: true
          anticheat:
            enabled: true
            auto-punish:
              enabled: true
              thresholds:
                kick: 12
                ban-1d: 24
                ban-7d: 36
                ban-30d: 48
          EOF

          cat > "$ROOT/START-NETWORK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          for %%S in (Lobby SMP) do (
            findstr /i /c:"eula=true" "%%S\eula.txt" >nul
            if errorlevel 1 (
              echo Accepte l'EULA dans %%S\eula.txt avant le demarrage.
              pause
              exit /b 1
            )
          )
          if not exist "SUPERVISEUR-RESEAU.ps1" (echo Fichier superviseur introuvable.& pause & exit /b 1)
          if not exist "DEMARRER-RESEAU.ps1" (echo Lanceur reseau introuvable.& pause & exit /b 1)
          echo Le mot de passe du panneau sera demande de facon masquee.
          echo Le superviseur gere Lobby, SMP et Velocity. /redemarrer relance les trois serveurs.
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0DEMARRER-RESEAU.ps1"
          pause
          EOF

          cat > "$ROOT/DEMARRER-VELOCITY-INITIAL.bat" <<'EOF'
          @echo off
          cd /d "%~dp0Velocity"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          if not exist "velocity.jar" (echo velocity.jar introuvable.& pause & exit /b 1)
          echo Premier lancement: attends que Geyser et Floodgate generent leurs fichiers.
          echo Quand Velocity est pret, tape CTRL+C dans cette fenetre pour l'arreter.
          java -Xms512M -Xmx1G -jar velocity.jar
          pause
          EOF

          cat > "$ROOT/CONFIGURER-BEDROCK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0Velocity"
          if not exist "plugins\Geyser-Velocity\config.yml" (
            echo Lance Velocity une fois, puis ferme-le avec CTRL+C.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p='plugins\Geyser-Velocity\config.yml'; $s=Get-Content -Raw $p; $s=[regex]::Replace($s,'(?m)^(\s*auth-type\s*:\s*)[^\r\n]+','$1floodgate'); $s=[regex]::Replace($s,'(?m)^(\s*transport\s*:\s*)[^\r\n]+','$1nethernet'); Set-Content -Path $p -Value $s -Encoding utf8"
          if errorlevel 1 (echo Echec de configuration Geyser.& pause & exit /b 1)
          echo Geyser configure: Floodgate + NetherNet. Ouvre TCP et UDP 19132.
          pause
          EOF

          cat > "$ROOT/CONFIGURER-RESEAU.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "FGKEY=%~dp0Velocity\\plugins\\floodgate\\key.pem"
          if not exist "%FGKEY%" (
            echo Cle Floodgate introuvable. Lance Velocity une fois puis ferme-le.
            pause
            exit /b 1
          )
          for %%S in (Lobby SMP) do (
            if not exist "%%S\\plugins\\floodgate" mkdir "%%S\\plugins\\floodgate"
            copy /Y "%FGKEY%" "%%S\\plugins\\floodgate\\key.pem" >nul
          )
          echo Cle Floodgate partagee avec Lobby et SMP.
          echo Les joueurs Java premium/crack doivent creer un compte avec /register puis /login; Bedrock passe par Floodgate.
          echo Les joueurs Bedrock passent par Floodgate.
          pause
          EOF

          cat > "$ROOT/CONFIGURER-LES-GROUPES.bat" <<'EOF'
          @echo off
          echo Entre ces commandes dans la console du SMP, sans slash:
          echo.
          echo lp creategroup admin
          echo lp group admin permission set larpers.admin true
          echo lp group admin permission set larpers.staff true
          echo lp group admin permission set larpers.anticheat.use true
          echo lp group admin permission set larpers.anticheat.alerts true
          echo.
          echo lp creategroup moderator
          echo lp group moderator permission set larpers.staff true
          echo lp group moderator permission set larpers.anticheat.mod true
          echo lp group moderator permission set larpers.anticheat.use true
          echo lp group moderator permission set larpers.anticheat.alerts true
          echo.
          echo lp user PSEUDO parent set admin
          echo lp user PSEUDO parent set moderator
          echo Remplace PSEUDO par le pseudo exact. Ne donne admin qu'aux personnes de confiance.
          pause
          EOF

          cat > "$ROOT/OUVRIR-PORTS-WINDOWS.bat" <<'EOF'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (echo Execute ce fichier en administrateur.& pause & exit /b 1)
          netsh advfirewall firewall add rule name="Larpers Java Velocity TCP 25565" dir=in action=allow protocol=TCP localport=25565
          netsh advfirewall firewall add rule name="Larpers Bedrock TCP 19132" dir=in action=allow protocol=TCP localport=19132
          netsh advfirewall firewall add rule name="Larpers Bedrock UDP 19132" dir=in action=allow protocol=UDP localport=19132
          echo Pare-feu Windows configure. Redirige aussi ces ports sur ton routeur.
          echo N'ouvre JAMAIS les ports backend 25566 et 25567 sur Internet.
          pause
          EOF

          cat > "$ROOT/LISEZ-MOI.txt" <<'EOF'
          LARPERS COIN - RESEAU COMPLET
          =============================
          Contenu:
          - Velocity proxy: port public Java 25565
          - Lobby Paper separe: 127.0.0.1:25566 (monde vide sans plateforme, spawn a Y=100, vol permanent, joueurs invisibles entre eux)
          - SMP Paper separe: 127.0.0.1:25567 (plugin LarpersCoin + LuckPerms)
          - Geyser + Floodgate installes sur Velocity, Floodgate aussi sur Lobby et SMP pour reconnaitre les joueurs Bedrock
          - Java premium et crack sont acceptes en mode offline; dans cette configuration, les comptes Java utilisent /register puis /login; Bedrock passe par Floodgate sans mot de passe
          - Lobby: les comptes Java utilisent /register <motdepasse> puis /login <motdepasse>; apres la premiere connexion, le meme pseudo depuis la meme IP est reconnu automatiquement; Bedrock est authentifie via Floodgate
          - Apres authentification, transfert automatique vers le SMP
          - Le SMP fait confiance au proxy prive; ne jamais exposer ses ports backend
          - Geyser doit etre configure avec auth-type: floodgate; les joueurs Bedrock Floodgate sont exemptes de /register et /login
          - Backend Paper lie a Velocity avec forwarding moderne et secret prive

          INSTALLATION:
          1. Installer Java 25.
          2. Lire https://aka.ms/MinecraftEULA et accepter l'EULA dans Lobby/eula.txt et SMP/eula.txt.
          3. Lancer DEMARRER-VELOCITY-INITIAL.bat une seule fois; attendre la generation des fichiers, puis arreter Velocity avec CTRL+C.
          4. Lancer CONFIGURER-RESEAU.bat pour partager la cle Floodgate sur Lobby/SMP.
          5. Lancer CONFIGURER-BEDROCK.bat (auth-type floodgate + transport nethernet).
          6. Lancer START-NETWORK.bat: il demarre Lobby, SMP, puis Velocity.
          7. Lancer OUVRIR-PORTS-WINDOWS.bat en administrateur; rediriger TCP 25565 et TCP+UDP 19132 sur le routeur.
          8. Les ports 25566 et 25567 restent locaux: ne pas les exposer sur Internet.
          9. Execute CONFIGURER-LES-GROUPES.bat et attribue les groupes depuis la console SMP.
          10. Dans Velocity, le lobby est le serveur d'arrivee; ajoute ensuite un NPC/portail/menu pour envoyer les joueurs au SMP.

          IMPORTANT:
          - FastLoginPlus est retire. Velocity est en online-mode=false pour accepter Java premium et crack. Les comptes Java doivent utiliser /register puis /login; Bedrock passe par Floodgate.
          - Garde le forwarding moderne et le secret prive identiques sur les deux Paper. Le mode online-mode du proxy et proxies.velocity.online-mode dans Paper doivent rester false pour accepter les comptes crack; les server.properties Paper restent en offline-mode derriere Velocity.
          - Bedrock doit passer par Geyser auth-type floodgate + NetherNet; la meme cle Floodgate doit etre partagee avec les deux backends.
          - La reconnexion IP est pratique mais moins sure: plusieurs personnes partageant la meme IP ne doivent pas partager le meme pseudo/compte.
          - Le mode offline accepte les comptes crack mais ne valide pas l'identite Microsoft des comptes Java: un joueur peut usurper un pseudo si l'authentification du plugin est contournee. Garde les backends prives et impose /register + /login.
          - Le plugin anticheat utilise des seuils de sanctions progressives configurables; ajuste-les apres tests. Il est désactivé dans le Lobby et actif dans le SMP.
          - /admin reset <joueur> supprime le mot de passe Java crack; si le joueur est en ligne, il reçoit un TITLE avec un compte à rebours de 10 secondes puis est kick. Il devra refaire /register à sa prochaine connexion.
          - Le fichier d'authentification du Lobby est partagé avec le SMP afin que /admin reset fonctionne depuis le SMP.
          - Les mondes et donnees existants ne sont pas inclus: ce ZIP est un paquet serveur propre.
          - Le premier demarrage et les connexions reelles doivent etre testes sur ta machine.
          EOF

      - name: Creer le ZIP reseau
        run: |
          cd package
          zip -qr ../LarpersCoin-Network.zip LarpersCoin-Network

      - name: Publier le ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LarpersCoin-Network
          path: LarpersCoin-Network.zip
          if-no-files-found: error
          retention-days: 90
