name: Package reseau complet Larry SMP (Velocity + Lobby + SMP)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/network-package.yml"
      - "plugin-source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-network:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Compiler Larry SMP
        working-directory: plugin-source
        run: gradle --no-daemon clean build

      - name: Telecharger Paper, Velocity et plugins
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarrySMP-Network"
          mkdir -p "$ROOT/Velocity/plugins" "$ROOT/Lobby/plugins" "$ROOT/SMP/plugins"

          paper_meta="$(curl -fsSL -H 'User-Agent: LarrySMP-Packager/1.0' "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds?channel=STABLE&limit=1")"
          paper_url="$(echo "$paper_meta" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$paper_url"
          curl -fL "$paper_url" -o "$ROOT/Lobby/paper.jar"
          cp "$ROOT/Lobby/paper.jar" "$ROOT/SMP/paper.jar"

          velocity_versions="$(curl -fsSL -H 'User-Agent: LarrySMP-Packager/1.0' "https://fill.papermc.io/v3/projects/velocity")"
          velocity_version="$(echo "$velocity_versions" | jq -r '[.versions[][] | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')"
          test -n "$velocity_version"
          velocity_meta="$(curl -fsSL -H 'User-Agent: LarrySMP-Packager/1.0' "https://fill.papermc.io/v3/projects/velocity/versions/$velocity_version/builds?channel=STABLE&limit=1")"
          velocity_url="$(echo "$velocity_meta" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$velocity_url"
          curl -fL "$velocity_url" -o "$ROOT/Velocity/velocity.jar"

          lp_meta="$(curl -fsSL https://metadata.luckperms.net/data/downloads)"
          lp_url="$(echo "$lp_meta" | jq -r '.downloads.bukkit // empty')"
          test -n "$lp_url"
          curl -fL "$lp_url" -o "$ROOT/SMP/plugins/LuckPerms.jar"

          plugin_jar="$(find plugin-source/build/libs -maxdepth 1 -type f -name 'LarpersCoin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$plugin_jar"
          cp "$plugin_jar" "$ROOT/SMP/plugins/LarpersCoin.jar"
          cp "$plugin_jar" "$ROOT/Lobby/plugins/LarpersCoin.jar"

          # EduGeyser + EduFloodgate: Minecraft Education et Bedrock via Velocity.
          edugeyser_meta="$(curl -fsSL https://api.github.com/repos/EduGeyser/EduGeyser/releases/latest)"
          edugeyser_url="$(echo "$edugeyser_meta" | jq -r '.assets[] | select(.name == "EduGeyser-Velocity.jar") | .browser_download_url' | head -n 1)"
          test -n "$edugeyser_url"
          curl -fL "$edugeyser_url" -o "$ROOT/Velocity/plugins/EduGeyser-Velocity.jar"
          edufloodgate_meta="$(curl -fsSL https://api.github.com/repos/EduGeyser/EduFloodgate/releases/latest)"
          edufloodgate_velocity_url="$(echo "$edufloodgate_meta" | jq -r '.assets[] | select(.name == "edufloodgate-velocity.jar") | .browser_download_url' | head -n 1)"
          edufloodgate_paper_url="$(echo "$edufloodgate_meta" | jq -r '.assets[] | select(.name == "edufloodgate-spigot.jar") | .browser_download_url' | head -n 1)"
          test -n "$edufloodgate_velocity_url"
          test -n "$edufloodgate_paper_url"
          curl -fL "$edufloodgate_velocity_url" -o "$ROOT/Velocity/plugins/edufloodgate-velocity.jar"
          # EduFloodgate remplace Floodgate sur les deux backends Paper.
          curl -fL "$edufloodgate_paper_url" -o "$ROOT/Lobby/plugins/edufloodgate-paper.jar"
          curl -fL "$edufloodgate_paper_url" -o "$ROOT/SMP/plugins/edufloodgate-paper.jar"
          test -s "$ROOT/Velocity/plugins/EduGeyser-Velocity.jar"
          test -s "$ROOT/Velocity/plugins/edufloodgate-velocity.jar"
          test -s "$ROOT/Lobby/plugins/edufloodgate-paper.jar"
          test -s "$ROOT/SMP/plugins/edufloodgate-paper.jar"

          papi_meta="$(curl -fsSL 'https://api.modrinth.com/v2/project/placeholderapi/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          papi_url="$(echo "$papi_meta" | jq -r '[.[] | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$papi_url"
          curl -fL "$papi_url" -o "$ROOT/Lobby/plugins/PlaceholderAPI.jar"
          cp "$ROOT/Lobby/plugins/PlaceholderAPI.jar" "$ROOT/SMP/plugins/PlaceholderAPI.jar"


          test -s "$ROOT/Lobby/plugins/PlaceholderAPI.jar"
          test -s "$ROOT/SMP/plugins/PlaceholderAPI.jar"

          # Compatibilite Java multi-version sur les deux backends Paper.
          for SERVER in Lobby SMP; do
            curl -fL "https://github.com/ViaVersion/ViaVersion/releases/download/5.12.2/ViaVersion-5.12.2.jar" -o "$ROOT/$SERVER/plugins/ViaVersion.jar"
            curl -fL "https://github.com/ViaVersion/ViaBackwards/releases/download/5.12.2/ViaBackwards-5.12.2.jar" -o "$ROOT/$SERVER/plugins/ViaBackwards.jar"
            test -s "$ROOT/$SERVER/plugins/ViaVersion.jar"
            test -s "$ROOT/$SERVER/plugins/ViaBackwards.jar"
          done

          # GrimAC sur le SMP uniquement; build Paper stable correspondant a Paper 26.3.
          grim_meta="$(curl -fsSL 'https://api.modrinth.com/v2/project/grimac/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          grim_url="$(echo "$grim_meta" | jq -r '[.[] | select(.version_type == "release") | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$grim_url"
          curl -fL "$grim_url" -o "$ROOT/SMP/plugins/GrimAC.jar"
          test -s "$ROOT/SMP/plugins/GrimAC.jar"
          mkdir -p "$ROOT/SMP/plugins/GrimAC"
          cat > "$ROOT/SMP/plugins/GrimAC/config.yml" <<'EOF'
          # Grim continue de détecter et d'envoyer les alertes au dashboard,
          # mais ne les imprime plus une par une dans la console Paper.
          alerts:
            print-to-console: false
          verbose:
            print-to-console: false
          EOF
          cat > "$ROOT/SMP/plugins/GrimAC/punishments.yml" <<'EOF'
          Punishments:
            Movement:
              remove-violations-after: 300
              checks:
                - "Simulation"
                - "GroundSpoof"
                - "Timer"
                # TimerLimit désactivé: faux positifs répétitifs observés sur Paper 26.3.
                - "NoFall"
                - "Knockback"
                - "Explosion"
                - "Post"
                - "Vehicle"
                - "NoSlow"
                - "Sprint"
                - "Elytra"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Combat:
              remove-violations-after: 300
              checks:
                - "Reach"
                - "Hitboxes"
                - "Interact"
                - "Aim"
                - "Killaura"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Packets:
              remove-violations-after: 300
              checks:
                - "BadPackets"
                - "PacketOrder"
                - "Crash"
                - "Exploit"
                - "TransactionOrder"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Other:
              remove-violations-after: 300
              checks:
                - "MultiActions"
                - "Place"
                - "Baritone"
                - "Break"
                - "Chat"
                - "Autoclicker"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
          
          EOF

      - name: Configurer Velocity, lobby et SMP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarrySMP-Network"
          SECRET="$(openssl rand -hex 32)"
          printf '%s' "$SECRET" > "$ROOT/Velocity/forwarding.secret"

          cat > "$ROOT/Velocity/velocity.toml" <<EOF
          config-version = "2.7"
          bind = "0.0.0.0:25565"
          motd = "<gold>Larry SMP Network</gold>"
          show-max-players = 100
          online-mode = false
          force-key-authentication = false
          player-info-forwarding-mode = "modern"
          forwarding-secret-file = "forwarding.secret"
          announce-forge = false
          kick-existing-players = false
          ping-passthrough = "DISABLED"
          sample-players-in-ping = false
          enable-player-address-logging = true

          [servers]
          lobby = "127.0.0.1:25566"
          smp = "127.0.0.1:25567"
          try = ["lobby"]

          [forced-hosts]

          [advanced]
          compression-threshold = 256
          compression-level = -1
          login-ratelimit = 3000
          connection-timeout = 5000
          read-timeout = 30000
          haproxy-protocol = false
          tcp-fast-open = false
          bungee-plugin-message-channel = true
          show-ping-requests = false
          failover-on-unexpected-server-disconnect = true
          announce-proxy-commands = true
          log-command-executions = false
          log-player-connections = true
          accepts-transfers = false
          enable-reuse-port = false

          [query]
          enabled = false
          port = 25565
          map = "Velocity"
          show-plugins = false
          EOF

          for SERVER in Lobby SMP; do
            PORT=25566
            PVP=false
            if [ "$SERVER" = "SMP" ]; then
              PORT=25567
              PVP=true
            fi
            cat > "$ROOT/$SERVER/eula.txt" <<'EOF'
          # EULA acceptee a la demande de l'administrateur. Conditions: https://aka.ms/MinecraftEULA
          eula=true
          EOF
            cat > "$ROOT/$SERVER/server.properties" <<EOF
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=false
          level-name=world
          gamemode=survival
          difficulty=normal
          hardcore=false
          max-players=100
          online-mode=false
          enforce-secure-profile=false
          pvp=$PVP
          server-port=$PORT
          server-ip=127.0.0.1
          motd=Larry SMP $SERVER
          view-distance=$([ "$SERVER" = "Lobby" ] && echo 3 || echo 6)
          simulation-distance=$([ "$SERVER" = "Lobby" ] && echo 2 || echo 4)
          network-compression-threshold=512
          spawn-protection=0
          allow-flight=true
          white-list=false
          EOF
            mkdir -p "$ROOT/$SERVER/config"
            cat > "$ROOT/$SERVER/config/paper-global.yml" <<EOF
          _version: 31
          proxies:
            velocity:
              enabled: true
              online-mode: false
              secret: "$SECRET"
          EOF
          done

          # Anti-Xray Paper natif niveau 3 sur le monde SMP (pas sur le lobby).
          cat > "$ROOT/SMP/config/paper-world-defaults.yml" <<'EOF'
          _version: 31
          anticheat:
            anti-xray:
              enabled: true
              engine-mode: 3
              hidden-blocks:
                - copper_ore
                - deepslate_copper_ore
                - raw_copper_block
                - diamond_ore
                - deepslate_diamond_ore
                - gold_ore
                - deepslate_gold_ore
                - iron_ore
                - deepslate_iron_ore
                - raw_iron_block
                - lapis_ore
                - deepslate_lapis_ore
                - redstone_ore
                - deepslate_redstone_ore
              lava-obscures: false
              max-block-height: 64
              replacement-blocks:
                - chest
                - amethyst_block
                - andesite
                - budding_amethyst
                - calcite
                - coal_ore
                - deepslate_coal_ore
                - deepslate
                - diorite
                - dirt
                - emerald_ore
                - deepslate_emerald_ore
                - granite
                - gravel
                - oak_planks
                - smooth_basalt
                - stone
                - tuff
              update-radius: 2
              use-permission: false
          EOF

          # Le monde du lobby est généré dans le vide par LarpersCoin.
          cat > "$ROOT/Lobby/bukkit.yml" <<'EOF'
          worlds:
            world:
              generator: LarpersCoin:empty
          EOF

          mkdir -p "$ROOT/SMP/plugins/LarpersCoin" "$ROOT/Lobby/plugins/LarpersCoin"
          cat > "$ROOT/Lobby/plugins/LarpersCoin/config.yml" <<'EOF'
          network:
            auth-only: true
          auth:
            proxy-authenticated: false
            remember-ip: true
            connect-to-smp: true
            storage-file: plugins/LarpersCoin/auth.yml
          server-display:
            name: Larry SMP
            ip: Non configurée
          EOF
          cat > "$ROOT/SMP/plugins/LarpersCoin/config.yml" <<'EOF'
          auth:
            proxy-authenticated: true
            remember-ip: false
            storage-file: ../Lobby/plugins/LarpersCoin/auth.yml
          lobby-return-compass:
            enabled: true
            server: lobby
          server-display:
            name: Larry SMP
            ip: Non configurée
          anticheat:
            enabled: true
            education-no-setback: true
            auto-punish:
              enabled: false
          web-admin:
            enabled: true
            bind: 127.0.0.1
            port: 80
          EOF

          cat > "$ROOT/START-NETWORK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          for %%S in (Lobby SMP) do (
            findstr /i /c:"eula=true" "%%S\eula.txt" >nul
            if errorlevel 1 (
              echo Accepte l'EULA dans %%S\eula.txt avant le demarrage.
              pause
              exit /b 1
            )
          )
          start "Larry Lobby" cmd /k "cd /d ""%~dp0Lobby"" && java -Dlarpers.server=Lobby -Xms512M -Xmx1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -jar paper.jar --nogui"
          timeout /t 8 /nobreak >nul
          start "Larry SMP" cmd /k "cd /d ""%~dp0SMP"" && java -Dlarpers.server=SMP -Xms1G -Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -jar paper.jar --nogui"
          timeout /t 8 /nobreak >nul
          start "Larry Velocity" cmd /k "cd /d ""%~dp0Velocity"" && java -Xms512M -Xmx1G -jar velocity.jar"
          echo Reseau demarre. Les joueurs se connectent sur le port Java 25565.
          echo Bedrock: port UDP 19132 apres configuration Geyser.
          pause
          EOF

          # Redemarrage individuel et arret propre par la console du serveur.
          cat > "$ROOT/REDEMARRER-SERVEUR.ps1" <<'EOF'
          param([Parameter(Mandatory=$true)][ValidateSet("Lobby","SMP")][string]$Server)
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $serverDir = Join-Path $root $Server
          $eula = Join-Path $serverDir "eula.txt"
          if (-not (Test-Path (Join-Path $serverDir "paper.jar")) -or -not (Test-Path $eula) -or -not (Select-String -Path $eula -Pattern "eula=true" -Quiet)) { Write-Host "Fichier Paper ou EULA manquant pour $Server."; exit 1 }
          $marker = "-Dlarpers.server=$Server"
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -match "^javaw?\.exe$" -and $_.CommandLine -and $_.CommandLine.Contains($marker) })
          if ($running.Count -gt 1) { Write-Host "Plusieurs processus $Server detectes; annulation."; exit 1 }
          if ($running.Count -eq 1) {
            $shell = New-Object -ComObject WScript.Shell
            if (-not $shell.AppActivate("Larry $Server")) { Write-Host "Console Larry $Server introuvable. Garde sa fenetre ouverte et reessaie."; exit 1 }
            Start-Sleep -Milliseconds 500
            $shell.SendKeys("stop{ENTER}")
            Write-Host "Arret propre demande; attente maximale de 120 secondes..."
            $pidToWait = [int]$running[0].ProcessId
            $deadline = (Get-Date).AddSeconds(120)
            do { Start-Sleep -Seconds 2; $stillRunning = Get-Process -Id $pidToWait -ErrorAction SilentlyContinue } while ($stillRunning -and (Get-Date) -lt $deadline)
            if ($stillRunning) { Write-Host "Arret non confirme. Aucun redemarrage force."; exit 1 }
          } else { Write-Host "$Server est deja arrete; demarrage..." }
          if ($Server -eq "Lobby") { $javaArgs = "-Dlarpers.server=Lobby -Xms512M -Xmx1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -jar paper.jar --nogui" }
          else { $javaArgs = "-Dlarpers.server=SMP -Xms1G -Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -jar paper.jar --nogui" }
          Start-Process -FilePath $env:ComSpec -WorkingDirectory $serverDir -ArgumentList @("/k", "title Larry $Server && java $javaArgs")
          Write-Host "$Server relance. Velocity et l’autre serveur restent actifs."
          EOF

          cat > "$ROOT/REDEMARRER.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          title Larry SMP - Redemarrage
          echo.
          echo ===== REDEMARRER UN SERVEUR =====
          echo 1. Lobby
          echo 2. SMP
          echo 0. Quitter
          echo.
          choice /c 120 /n /m "Choisis le serveur a redemarrer : "
          if errorlevel 3 exit /b 0
          if errorlevel 2 powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0REDEMARRER-SERVEUR.ps1" -Server SMP
          if errorlevel 1 if not errorlevel 2 powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0REDEMARRER-SERVEUR.ps1" -Server Lobby
          pause
          EOF

                    cat > "$ROOT/REDEMARRER-LOBBY.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0REDEMARRER-SERVEUR.ps1" -Server Lobby
          pause
          EOF

          cat > "$ROOT/REDEMARRER-SMP.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0REDEMARRER-SERVEUR.ps1" -Server SMP
          pause
          EOF

                    cat > "$ROOT/DEMARRER-VELOCITY-INITIAL.bat" <<'EOF'
          @echo off
          cd /d "%~dp0Velocity"
          where java >nul 2>nul
          if errorlevel 1 (echo Java 25 est requis.& pause & exit /b 1)
          if not exist "velocity.jar" (echo velocity.jar introuvable.& pause & exit /b 1)
          echo Premier lancement: attends que Velocity genere les fichiers de Geyser et Floodgate.
          echo Quand Velocity est pret, tape CTRL+C dans cette fenetre pour l'arreter.
          java -Xms512M -Xmx1G -jar velocity.jar
          pause
          EOF

          cat > "$ROOT/CONFIGURER-BEDROCK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0Velocity"
          if not exist "plugins\Geyser-Velocity\config.yml" (
            echo Lance Velocity une fois, puis ferme-le avec CTRL+C.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p='plugins\Geyser-Velocity\config.yml'; $s=Get-Content -Raw $p; $s=[regex]::Replace($s,'(?m)^(\s*auth-type\s*:\s*)[^\r\n]+','$1floodgate'); $s=[regex]::Replace($s,'(?m)^(\s*transport\s*:\s*)[^\r\n]+','$1nethernet'); Set-Content -Path $p -Value $s -Encoding utf8"
          if errorlevel 1 (echo Echec de configuration Geyser.& pause & exit /b 1)
          echo EduGeyser configure: EduFloodgate + NetherNet. Ouvre TCP et UDP 19132.
          pause
          EOF

          cat > "$ROOT/CONFIGURER-RESEAU.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "FGKEY=%~dp0Velocity\plugins\floodgate\key.pem"
          if not exist "%FGKEY%" (
            echo Cle EduFloodgate introuvable.
            echo Demarre Velocity une fois, puis ferme-le proprement.
            pause
            exit /b 1
          )
          for %%S in (Lobby SMP) do (
            if not exist "%%S\plugins\floodgate" mkdir "%%S\plugins\floodgate"
            copy /Y "%FGKEY%" "%%S\plugins\floodgate\key.pem" >nul
          )
          echo.
          echo Cle EduFloodgate partagee avec Lobby et SMP.
          echo L'authentification des joueurs est geree par LarpersCoin.
          echo Redemarre Lobby, SMP puis Velocity.
          pause
          EOF

          cat > "$ROOT/CONFIGURER-LES-GROUPES.bat" <<'EOF'
          @echo off
          echo Entre ces commandes dans la console du SMP, sans slash:
          echo.
          echo lp creategroup admin
          echo lp group admin permission set larpers.admin true
          echo lp group admin permission set larpers.staff true
          echo lp group admin permission set larpers.anticheat.use true
          echo lp group admin permission set larpers.anticheat.alerts true
          echo lp group admin permission set grim.alerts true
          echo.
          echo lp creategroup moderator
          echo lp group moderator permission set larpers.staff true
          echo lp group moderator permission set larpers.anticheat.mod true
          echo lp group moderator permission set larpers.anticheat.use true
          echo lp group moderator permission set larpers.anticheat.alerts true
          echo lp group moderator permission set grim.alerts true
          echo.
          echo lp user PSEUDO parent set admin
          echo lp user PSEUDO parent set moderator
          echo Remplace PSEUDO par le pseudo exact. Ne donne admin qu'aux personnes de confiance.
          pause
          EOF

          cat > "$ROOT/OUVRIR-PORTS-WINDOWS.bat" <<'EOF'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (echo Execute ce fichier en administrateur.& pause & exit /b 1)
          netsh advfirewall firewall add rule name="Larpers Java Velocity TCP 25565" dir=in action=allow protocol=TCP localport=25565
          netsh advfirewall firewall add rule name="Larpers Bedrock TCP 19132" dir=in action=allow protocol=TCP localport=19132
          netsh advfirewall firewall add rule name="Larpers Bedrock UDP 19132" dir=in action=allow protocol=UDP localport=19132
          echo Pare-feu Windows configure. Redirige aussi ces ports sur ton routeur.
          echo N'ouvre JAMAIS les ports backend 25566 et 25567 sur Internet.
          pause
          EOF

          cat > "$ROOT/LISEZ-MOI.txt" <<'EOF'
          LARRY SMP - RESEAU COMPLET
          =============================
          Contenu:
          - Velocity proxy: port public Java 25565
          - Lobby Paper separe: 127.0.0.1:25566 (authentification uniquement: /register et /login)
          - SMP Paper separe: 127.0.0.1:25567 (plugin LarpersCoin + LuckPerms)
          - EduGeyser + EduFloodgate sur Velocity, EduFloodgate sur Lobby et SMP
          - Authentification des joueurs geree par LarpersCoin; Floodgate identifie les joueurs Bedrock
          - Apres authentification, transfert automatique vers le SMP
          - Le SMP fait confiance au proxy prive; ne jamais exposer ses ports backend
          - EduGeyser doit etre configure avec auth-type: floodgate; les joueurs Bedrock Floodgate sont exemptes de /register et /login
          - Backend Paper lie a Velocity avec forwarding moderne et secret prive

          INSTALLATION:
          1. Installer Java 25.
          2. Lire https://aka.ms/MinecraftEULA et accepter l'EULA dans Lobby/eula.txt et SMP/eula.txt.
          3. Lancer DEMARRER-VELOCITY-INITIAL.bat une seule fois; attendre la generation des fichiers, puis arreter Velocity avec CTRL+C.
          4. Lancer CONFIGURER-RESEAU.bat pour partager la cle Floodgate sur Lobby/SMP.
          5. Lancer CONFIGURER-BEDROCK.bat (auth-type floodgate + transport nethernet).
          6. Lancer START-NETWORK.bat: il demarre Lobby, SMP, puis Velocity.
          7. Lancer OUVRIR-PORTS-WINDOWS.bat en administrateur; rediriger TCP 25565 et TCP+UDP 19132 sur le routeur.
          8. Les ports 25566 et 25567 restent locaux: ne pas les exposer sur Internet.
          9. Execute CONFIGURER-LES-GROUPES.bat et attribue les groupes depuis la console SMP.
          10. Dans Velocity, le lobby est le serveur d'arrivee; ajoute ensuite un NPC/portail/menu pour envoyer les joueurs au SMP.

          IMPORTANT:
          - Garde le forwarding moderne et le secret prive identiques sur les deux Paper. Le mode online-mode du proxy et celui de proxies.velocity.online-mode dans Paper doivent rester false pour ce mode mixte.
          - Bedrock et Education passent par EduGeyser auth-type floodgate + NetherNet; la meme cle Floodgate doit etre partagee avec les deux backends.
          - La reconnexion IP est pratique mais moins sure: plusieurs personnes partageant la meme IP ne doivent pas partager le meme pseudo/compte.
          - Ne change pas online-mode du proxy et ne rends jamais les ports backend publics.
          - GrimAC est configure pour alerter et journaliser uniquement: aucun kick/ban automatique.
          - Les permissions grim.alerts sont proposees aux groupes admin et moderator.
          - Dashboard web: http://127.0.0.1 sur la machine SMP (port 8765 si le port 80 est occupé); jeton dans SMP/plugins/LarpersCoin/web-admin.yml.
          - La console web execute des commandes avec les droits console: protege le jeton et passe par HTTPS si tu l'exposes via un reverse proxy.
          - Les mondes et donnees existants ne sont pas inclus: ce ZIP est un paquet serveur propre.
          - Le premier demarrage et les connexions reelles doivent etre testes sur ta machine.
          EOF

      - name: Creer le ZIP reseau
        run: |
          cd package
          zip -qr ../LarrySMP-Network.zip LarrySMP-Network

      - name: Publier le ZIP
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LarrySMP-Network
          path: LarrySMP-Network.zip
          if-no-files-found: error
          retention-days: 90

      - name: Afficher le bouton de téléchargement
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## 📦 LarrySMP Network"
            echo
            echo "[⬇️ Télécharger LarrySMP-Network.zip]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
