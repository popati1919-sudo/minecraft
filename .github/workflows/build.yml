name: Build LarpersCoin

on:
  push:
    branches: [main, auth/velocity-replacement]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Paper plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and test
        working-directory: plugin-source
        run: gradle --no-daemon clean build
      - name: Build Velocity companion plugin
        working-directory: velocity-plugin
        run: gradle --no-daemon clean build
      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: LarpersCoin-Paper-26.3
          path: plugin-source/build/libs/LarpersCoin-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: LarpersCoin-Velocity
          path: velocity-plugin/build/libs/LarpersCoinVelocity-*.jar
          if-no-files-found: error
          retention-days: 30
