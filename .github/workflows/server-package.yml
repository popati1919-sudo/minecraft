name: Package serveur complet Larpers Coin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-package.yml"
      - "plugin-source/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Compiler le plugin
        working-directory: plugin-source
        run: gradle --no-daemon clean build

      - name: Préparer le serveur Paper 26.3 et LuckPerms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/LarpersCoin-Server-Ready/plugins
          PAPER_VERSION="26.3"
          PAPER_META="$(curl -fsSL -H 'User-Agent: LarpersCoin-Server-Packager/1.0 (github.com/popati1919-sudo/minecraft)' "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds?channel=STABLE&limit=1")"
          PAPER_URL="$(echo "$PAPER_META" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$PAPER_URL"
          curl -fL "$PAPER_URL" -o package/LarpersCoin-Server-Ready/paper.jar
          test -s package/LarpersCoin-Server-Ready/paper.jar

          LP_META="$(curl -fsSL https://metadata.luckperms.net/data/downloads)"
          LP_URL="$(echo "$LP_META" | jq -r '.downloads.bukkit // empty')"
          test -n "$LP_URL"
          curl -fL "$LP_URL" -o package/LarpersCoin-Server-Ready/plugins/LuckPerms.jar
          test -s package/LarpersCoin-Server-Ready/plugins/LuckPerms.jar

          GEYSER_URL="https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot"
          FLOODGATE_URL="https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"
          curl -fL "$GEYSER_URL" -o package/LarpersCoin-Server-Ready/plugins/Geyser-Spigot.jar
          curl -fL "$FLOODGATE_URL" -o package/LarpersCoin-Server-Ready/plugins/floodgate-spigot.jar
          test -s package/LarpersCoin-Server-Ready/plugins/Geyser-Spigot.jar
          test -s package/LarpersCoin-Server-Ready/plugins/floodgate-spigot.jar

          PLUGIN_JAR="$(find plugin-source/build/libs -maxdepth 1 -type f -name 'LarpersCoin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$PLUGIN_JAR"
          cp "$PLUGIN_JAR" package/LarpersCoin-Server-Ready/plugins/LarpersCoin.jar

          # FastLoginPlus vérifie les comptes Java premium sur un serveur offline.
          FLP_META="$(curl -fsSL 'https://api.modrinth.com/v2/project/fastloginplus/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          FLP_URL="$(echo "$FLP_META" | jq -r '[.[] | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$FLP_URL"
          curl -fL "$FLP_URL" -o package/LarpersCoin-Server-Ready/plugins/FastLoginPlus.jar
          test -s package/LarpersCoin-Server-Ready/plugins/FastLoginPlus.jar

          PROTO_META="$(curl -fsSL 'https://api.modrinth.com/v2/project/protocol-lib/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          PROTO_URL="$(echo "$PROTO_META" | jq -r '[.[] | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$PROTO_URL"
          curl -fL "$PROTO_URL" -o package/LarpersCoin-Server-Ready/plugins/ProtocolLib.jar
          test -s package/LarpersCoin-Server-Ready/plugins/ProtocolLib.jar

      - name: Ajouter les fichiers de configuration Windows
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarpersCoin-Server-Ready"
          cat > "$ROOT/eula.txt" <<'EOF'
          # Lis https://aka.ms/MinecraftEULA puis remplace eula=false par eula=true si tu acceptes.
          eula=false
          EOF
          cat > "$ROOT/server.properties" <<'EOF'
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=false
          level-name=world
          gamemode=survival
          difficulty=normal
          hardcore=false
          max-players=30
          online-mode=false
          enforce-secure-profile=false
          pvp=true
          server-port=25565
          server-ip=
          motd=Larpers Coin SMP
          view-distance=8
          simulation-distance=6
          spawn-protection=0
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          EOF
          cat > "$ROOT/START-SERVER.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          title Larpers Coin SMP - Paper 26.3
          where java >nul 2>nul
          if errorlevel 1 (
            echo Java 25 est requis. Installe un JDK 25 puis relance.
            pause
            exit /b 1
          )
          if not exist "paper.jar" (
            echo paper.jar est manquant. Retelecharge le ZIP complet depuis GitHub Actions.
            pause
            exit /b 1
          )
          findstr /i /c:"eula=true" eula.txt >nul
          if errorlevel 1 (
            echo.
            echo Lis et accepte d'abord le contrat Minecraft dans eula.txt.
            echo Ouvre eula.txt et remplace eula=false par eula=true seulement si tu acceptes.
            pause
            exit /b 1
          )
          java -Xms2G -Xmx4G -jar paper.jar --nogui
          pause
          EOF
          cat > "$ROOT/CONFIGURER-BEDROCK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "CFG=plugins\Geyser-Spigot\config.yml"
          if not exist "%CFG%" (
            echo Lance le serveur une premiere fois, puis arrete-le avec stop.
            echo Geyser doit generer son fichier config.yml avant cette etape.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p='%CFG%'; $s=Get-Content -Raw -LiteralPath $p; if($s -notmatch '(?m)^\s*auth-type\s*:'){Write-Error 'auth-type introuvable dans la configuration Geyser'; exit 2}; $s=[regex]::Replace($s,'(?m)^(\s*auth-type\s*:\s*)[^\r\n]+','$1floodgate'); Set-Content -LiteralPath $p -Value $s -Encoding utf8"
          if errorlevel 1 (
            echo Echec de configuration. Modifie remote.auth-type en floodgate dans config.yml.
            pause
            exit /b 1
          )
          echo Geyser configure pour Floodgate.
          echo Redemarre le serveur. Ouvre le port 19132 en TCP et UDP.
          pause
          EOF
          cat > "$ROOT/OUVRIR-PORTS-WINDOWS.bat" <<'EOF'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (
            echo Clique droit sur ce fichier puis Executer en tant qu'administrateur.
            pause
            exit /b 1
          )
          netsh advfirewall firewall add rule name="LarpersCoin Java TCP 25565" dir=in action=allow protocol=TCP localport=25565
          netsh advfirewall firewall add rule name="LarpersCoin Bedrock TCP 19132" dir=in action=allow protocol=TCP localport=19132
          netsh advfirewall firewall add rule name="LarpersCoin Bedrock UDP 19132" dir=in action=allow protocol=UDP localport=19132
          echo Regles du pare-feu Windows ajoutees.
          echo Il faut aussi rediriger TCP 25565 et TCP+UDP 19132 sur le routeur.
          pause
          EOF
          cat > "$ROOT/CONFIGURER-LES-GROUPES.bat" <<'EOF'
          @echo off
          echo Execute ces commandes dans la console du serveur, sans le slash:
          echo.
          echo lp creategroup admin
          echo lp group admin permission set larpers.admin true
          echo lp group admin permission set larpers.staff true
          echo lp group admin permission set larpers.anticheat.use true
          echo lp group admin permission set larpers.anticheat.alerts true
          echo.
          echo lp creategroup moderator
          echo lp group moderator permission set larpers.staff true
          echo lp group moderator permission set larpers.anticheat.mod true
          echo lp group moderator permission set larpers.anticheat.use true
          echo lp group moderator permission set larpers.anticheat.alerts true
          echo.
          echo lp user PSEUDO parent set moderator
          echo lp user PSEUDO parent set admin
          echo Remplace PSEUDO par le vrai pseudo. Ne donne admin qu'aux personnes de confiance.
          pause
          EOF
          cat > "$ROOT/LISEZ-MOI.txt" <<'EOF'
          LARPERS COIN SMP - SERVEUR PAPER 26.3
          =====================================
          Inclus:
          - Paper 26.3
          - Java 25 requis
          - Plugin LarpersCoin compile depuis le depot
          - LuckPerms (gestion Admin/Moderateur)
          - Geyser + Floodgate (accès Bedrock)
          - Authentification automatique Java premium via FastLoginPlus
          - Authentification Bedrock via Floodgate
          - Comptes Java crack via /register et /login (mots de passe PBKDF2)
          - Configuration de base et scripts Windows

          PREMIER DEMARRAGE:
          1. Installe Java 25 (JDK/JRE).
          2. Lis https://aka.ms/MinecraftEULA.
          3. Si tu acceptes, ouvre eula.txt et change eula=false en eula=true.
          4. Lance START-SERVER.bat.
          5. Au premier demarrage, Geyser et Floodgate generent leur configuration; arrete avec stop.
          6. Lance CONFIGURER-BEDROCK.bat pour régler Geyser sur Floodgate, puis redemarre.
          7. Lance OUVRIR-PORTS-WINDOWS.bat en administrateur; redirige aussi les ports sur le routeur.
          8. Configure les groupes avec CONFIGURER-LES-GROUPES.bat.
          9. Les comptes Java premium sont verifies par FastLoginPlus; aucun mot de passe serveur.
          10. Les comptes Java crack utilisent /register <motdepasse> <confirmation>, puis /login <motdepasse>.
          11. Bedrock passe par Floodgate et est exempté du mot de passe LPC.

          RESEAU:
          - Java: TCP 25565.
          - Bedrock: TCP + UDP 19132 (routeur et pare-feu Windows).
          - online-mode=true: seuls les comptes Java premium authentifies par Mojang/Microsoft peuvent entrer.
          - Les comptes Java crackes/non premium sont refuses; ne desactive pas cette protection.
          - Floodgate authentifie Bedrock sans mot de passe AuthMe.
          - Ne partage jamais les acces admin.

          IMPORTANT:
          Ce paquet est prepare automatiquement. Il n'a pas encore ete valide par un
          demarrage complet sur ta machine ni par un test de charge/Bedrock.
          Fais une sauvegarde du dossier world et des fichiers plugins avant chaque mise a jour.
          EOF

      - name: Creer le ZIP du serveur
        run: |
          cd package
          zip -qr ../LarpersCoin-Server-Ready.zip LarpersCoin-Server-Ready

      - name: Publier le ZIP comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LarpersCoin-Server-Ready
          path: LarpersCoin-Server-Ready.zip
          if-no-files-found: error
          retention-days: 90
