name: Package serveur complet Larry SMP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-package.yml"
      - "plugin-source/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Compiler le plugin
        working-directory: plugin-source
        run: gradle --no-daemon clean build

      - name: Préparer le serveur Paper 26.3 et LuckPerms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/LarrySMP-Server-Ready/plugins
          PAPER_VERSION="26.3"
          PAPER_META="$(curl -fsSL -H 'User-Agent: LarpersCoin-Server-Packager/1.0 (github.com/popati1919-sudo/minecraft)' "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds?channel=STABLE&limit=1")"
          PAPER_URL="$(echo "$PAPER_META" | jq -r '.[0].downloads["server:default"].url // empty')"
          test -n "$PAPER_URL"
          curl -fL "$PAPER_URL" -o package/LarrySMP-Server-Ready/paper.jar
          test -s package/LarrySMP-Server-Ready/paper.jar

          LP_META="$(curl -fsSL https://metadata.luckperms.net/data/downloads)"
          LP_URL="$(echo "$LP_META" | jq -r '.downloads.bukkit // empty')"
          test -n "$LP_URL"
          curl -fL "$LP_URL" -o package/LarrySMP-Server-Ready/plugins/LuckPerms.jar
          test -s package/LarrySMP-Server-Ready/plugins/LuckPerms.jar

          EDUGEYSER_META="$(curl -fsSL https://api.github.com/repos/EduGeyser/EduGeyser/releases/latest)"
          EDUGEYSER_URL="$(echo "$EDUGEYSER_META" | jq -r '.assets[] | select(.name == "EduGeyser-Spigot.jar") | .browser_download_url' | head -n 1)"
          EDUFLOODGATE_META="$(curl -fsSL https://api.github.com/repos/EduGeyser/EduFloodgate/releases/latest)"
          EDUFLOODGATE_URL="$(echo "$EDUFLOODGATE_META" | jq -r '.assets[] | select(.name == "edufloodgate-spigot.jar") | .browser_download_url' | head -n 1)"
          test -n "$EDUGEYSER_URL"
          test -n "$EDUFLOODGATE_URL"
          curl -fL "$EDUGEYSER_URL" -o package/LarrySMP-Server-Ready/plugins/EduGeyser-Spigot.jar
          curl -fL "$EDUFLOODGATE_URL" -o package/LarrySMP-Server-Ready/plugins/edufloodgate-spigot.jar
          test -s package/LarrySMP-Server-Ready/plugins/EduGeyser-Spigot.jar
          test -s package/LarrySMP-Server-Ready/plugins/edufloodgate-spigot.jar

          curl -fL "https://github.com/ViaVersion/ViaVersion/releases/download/5.12.2/ViaVersion-5.12.2.jar" -o package/LarrySMP-Server-Ready/plugins/ViaVersion.jar
          curl -fL "https://github.com/ViaVersion/ViaBackwards/releases/download/5.12.2/ViaBackwards-5.12.2.jar" -o package/LarrySMP-Server-Ready/plugins/ViaBackwards.jar
          GRIM_META="$(curl -fsSL 'https://api.modrinth.com/v2/project/grimac/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22paper%22%5D')"
          GRIM_URL="$(echo "$GRIM_META" | jq -r '[.[] | select(.version_type == "release") | .files[] | select(.primary == true) | .url][0] // empty')"
          test -n "$GRIM_URL"
          curl -fL "$GRIM_URL" -o package/LarrySMP-Server-Ready/plugins/GrimAC.jar
          test -s package/LarrySMP-Server-Ready/plugins/ViaVersion.jar
          test -s package/LarrySMP-Server-Ready/plugins/ViaBackwards.jar
          test -s package/LarrySMP-Server-Ready/plugins/GrimAC.jar
          mkdir -p package/LarrySMP-Server-Ready/plugins/GrimAC
          cat > "package/LarrySMP-Server-Ready/plugins/GrimAC/config.yml" <<'EOF'
          # Grim continue de détecter et d'envoyer les alertes au dashboard,
          # mais ne les imprime plus une par une dans la console Paper.
          alerts:
            print-to-console: false
          verbose:
            print-to-console: false
          EOF
          cat > package/LarrySMP-Server-Ready/plugins/GrimAC/punishments.yml <<'EOF'
          Punishments:
            Movement:
              remove-violations-after: 300
              checks:
                - "Simulation"
                - "GroundSpoof"
                - "Timer"
                # TimerLimit désactivé: faux positifs répétitifs observés sur Paper 26.3.
                - "NoFall"
                - "Knockback"
                - "Explosion"
                - "Post"
                - "Vehicle"
                - "NoSlow"
                - "Sprint"
                - "Elytra"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Combat:
              remove-violations-after: 300
              checks:
                - "Reach"
                - "Hitboxes"
                - "Interact"
                - "Aim"
                - "Killaura"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Packets:
              remove-violations-after: 300
              checks:
                - "BadPackets"
                - "PacketOrder"
                - "Crash"
                - "Exploit"
                - "TransactionOrder"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
            Other:
              remove-violations-after: 300
              checks:
                - "MultiActions"
                - "Place"
                - "Baritone"
                - "Break"
                - "Chat"
                - "Autoclicker"
              commands:
                - "1:1 [alert]"
                - "1:1 [log]"
          
          EOF

          PLUGIN_JAR="$(find plugin-source/build/libs -maxdepth 1 -type f -name 'LarpersCoin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$PLUGIN_JAR"
          cp "$PLUGIN_JAR" package/LarrySMP-Server-Ready/plugins/LarpersCoin.jar

      - name: Ajouter les fichiers de configuration Windows
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/LarrySMP-Server-Ready"
          cat > "$ROOT/eula.txt" <<'EOF'
          # Lis https://aka.ms/MinecraftEULA puis remplace eula=false par eula=true si tu acceptes.
          eula=false
          EOF
          mkdir -p "$ROOT/config"
          cat > "$ROOT/config/paper-world-defaults.yml" <<'EOF'
          _version: 31
          anticheat:
            anti-xray:
              enabled: true
              engine-mode: 3
              hidden-blocks:
                - copper_ore
                - deepslate_copper_ore
                - raw_copper_block
                - diamond_ore
                - deepslate_diamond_ore
                - gold_ore
                - deepslate_gold_ore
                - iron_ore
                - deepslate_iron_ore
                - raw_iron_block
                - lapis_ore
                - deepslate_lapis_ore
                - redstone_ore
                - deepslate_redstone_ore
              lava-obscures: false
              max-block-height: 64
              replacement-blocks:
                - chest
                - amethyst_block
                - andesite
                - budding_amethyst
                - calcite
                - coal_ore
                - deepslate_coal_ore
                - deepslate
                - diorite
                - dirt
                - emerald_ore
                - deepslate_emerald_ore
                - granite
                - gravel
                - oak_planks
                - smooth_basalt
                - stone
                - tuff
              update-radius: 2
              use-permission: false
          EOF
          cat > "$ROOT/server.properties" <<'EOF'
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=false
          level-name=world
          gamemode=survival
          difficulty=normal
          hardcore=false
          max-players=30
          online-mode=false
          enforce-secure-profile=false
          pvp=true
          server-port=25565
          server-ip=
          motd=Bienvenue sur Larry SMP!
          view-distance=6
          simulation-distance=4
          network-compression-threshold=512
          spawn-protection=0
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          EOF
          mkdir -p "$ROOT/plugins/LarpersCoin"
          cat > "$ROOT/plugins/LarpersCoin/config.yml" <<'EOF'
          auth:
            proxy-authenticated: false
            remember-ip: false
          server-display:
            name: Larry SMP
            ip: Non configurée
          anticheat:
            enabled: true
            education-no-setback: true
          web-admin:
            enabled: true
            bind: 127.0.0.1
            port: 80
          EOF
          cat > "$ROOT/START-SERVER.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          title Larry SMP - Paper 26.3
          where java >nul 2>nul
          if errorlevel 1 (
            echo Java 25 est requis. Installe un JDK 25 puis relance.
            pause
            exit /b 1
          )
          if not exist "paper.jar" (
            echo paper.jar est manquant. Retelecharge le ZIP complet depuis GitHub Actions.
            pause
            exit /b 1
          )
          findstr /i /c:"eula=true" eula.txt >nul
          if errorlevel 1 (
            echo.
            echo Lis et accepte d'abord le contrat Minecraft dans eula.txt.
            echo Ouvre eula.txt et remplace eula=false par eula=true seulement si tu acceptes.
            pause
            exit /b 1
          )
          java -Xms2G -Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -jar paper.jar --nogui
          pause
          EOF
          cat > "$ROOT/CONFIGURER-BEDROCK.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "CFG=plugins\Geyser-Spigot\config.yml"
          if not exist "%CFG%" (
            echo Lance le serveur une premiere fois, puis arrete-le avec stop.
            echo EduGeyser doit generer son fichier config.yml avant cette etape.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p='%CFG%'; $s=Get-Content -Raw -LiteralPath $p; if($s -notmatch '(?m)^\s*auth-type\s*:'){Write-Error 'auth-type introuvable dans la configuration Geyser'; exit 2}; $s=[regex]::Replace($s,'(?m)^(\s*auth-type\s*:\s*)[^\r\n]+','$1floodgate'); Set-Content -LiteralPath $p -Value $s -Encoding utf8"
          if errorlevel 1 (
            echo Echec de configuration. Modifie remote.auth-type en floodgate dans config.yml.
            pause
            exit /b 1
          )
          echo EduGeyser configure pour EduFloodgate.
          echo Redemarre le serveur. Ouvre le port 19132 en TCP et UDP.
          pause
          EOF
          cat > "$ROOT/OUVRIR-PORTS-WINDOWS.bat" <<'EOF'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (
            echo Clique droit sur ce fichier puis Executer en tant qu'administrateur.
            pause
            exit /b 1
          )
          netsh advfirewall firewall add rule name="Larry SMP Java TCP 25565" dir=in action=allow protocol=TCP localport=25565
          netsh advfirewall firewall add rule name="Larry SMP Bedrock TCP 19132" dir=in action=allow protocol=TCP localport=19132
          netsh advfirewall firewall add rule name="Larry SMP Bedrock UDP 19132" dir=in action=allow protocol=UDP localport=19132
          echo Regles du pare-feu Windows ajoutees.
          echo Il faut aussi rediriger TCP 25565 et TCP+UDP 19132 sur le routeur.
          pause
          EOF
          cat > "$ROOT/CONFIGURER-LES-GROUPES.bat" <<'EOF'
          @echo off
          echo Execute ces commandes dans la console du serveur, sans le slash:
          echo.
          echo lp creategroup admin
          echo lp group admin permission set larpers.admin true
          echo lp group admin permission set larpers.staff true
          echo lp group admin permission set larpers.anticheat.use true
          echo lp group admin permission set larpers.anticheat.alerts true
          echo lp group admin permission set grim.alerts true
          echo.
          echo lp creategroup moderator
          echo lp group moderator permission set larpers.staff true
          echo lp group moderator permission set larpers.anticheat.mod true
          echo lp group moderator permission set larpers.anticheat.use true
          echo lp group moderator permission set larpers.anticheat.alerts true
          echo lp group moderator permission set grim.alerts true
          echo.
          echo lp user PSEUDO parent set moderator
          echo lp user PSEUDO parent set admin
          echo Remplace PSEUDO par le vrai pseudo. Ne donne admin qu'aux personnes de confiance.
          pause
          EOF
          cat > "$ROOT/LISEZ-MOI.txt" <<'EOF'
          LARRY SMP SMP - SERVEUR PAPER 26.3
          =====================================
          Inclus:
          - Paper 26.3
          - Java 25 requis
          - Plugin LarpersCoin compile depuis le depot
          - LuckPerms (gestion Admin/Moderateur)
          - EduGeyser + EduFloodgate (accès Education et Bedrock)
          - ViaVersion + ViaBackwards (compatibilité Java multi-version)
          - GrimAC (anticheat; vérifications manuelles, aucune sanction automatique)
          - Authentification Java par /register et /login LarpersCoin
          - Authentification Bedrock et Education via EduFloodgate
          - Comptes Java crack via /register et /login (mots de passe PBKDF2)
          - Configuration de base et scripts Windows
          - Dashboard web avec console temps reel et execution de commandes admin
          - GrimAC configure en alertes/logs seulement, sans kick/ban automatique
          - ViaVersion + ViaBackwards pour les versions Java compatibles

          PREMIER DEMARRAGE:
          1. Installe Java 25 (JDK/JRE).
          2. Lis https://aka.ms/MinecraftEULA.
          3. Si tu acceptes, ouvre eula.txt et change eula=false en eula=true.
          4. Lance START-SERVER.bat.
          5. Au premier demarrage, EduGeyser et EduFloodgate generent leur configuration; arrete avec stop.
          6. Lance CONFIGURER-BEDROCK.bat pour régler EduGeyser sur EduFloodgate, puis redemarre.
          7. Lance OUVRIR-PORTS-WINDOWS.bat en administrateur; redirige aussi les ports sur le routeur.
          8. Configure les groupes avec CONFIGURER-LES-GROUPES.bat.
          9. Dashboard: http://127.0.0.1 (si le port 80 est occupé, http://127.0.0.1:8765); jeton dans plugins/LarpersCoin/web-admin.yml.
          10. La console du site execute les commandes avec les droits console: garde le jeton secret.
          11. Tous les joueurs Java utilisent /register <motdepasse> puis /login <motdepasse>.
          12. Bedrock et Education passent par EduFloodgate et est exempté du mot de passe Larry.

          RESEAU:
          - Java: TCP 25565.
          - Bedrock: TCP + UDP 19132 (routeur et pare-feu Windows).
          - online-mode=true: seuls les comptes Java premium authentifies par Mojang/Microsoft peuvent entrer.
          - Les comptes Java crackes/non premium sont refuses; ne desactive pas cette protection.
          - Floodgate authentifie Bedrock sans mot de passe AuthMe.
          - Ne partage jamais les acces admin.

          IMPORTANT:
          Ce paquet est prepare automatiquement. Il n'a pas encore ete valide par un
          demarrage complet sur ta machine ni par un test de charge/Bedrock.
          Fais une sauvegarde du dossier world et des fichiers plugins avant chaque mise a jour.
          EOF

      - name: Creer le ZIP du serveur
        run: |
          cd package
          zip -qr ../LarrySMP-Server-Ready.zip LarrySMP-Server-Ready

      - name: Publier le ZIP comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LarrySMP-Server-Ready
          path: LarrySMP-Server-Ready.zip
          if-no-files-found: error
          retention-days: 90
