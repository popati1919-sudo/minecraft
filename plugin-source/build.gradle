plugins { id 'java' }

group = 'ca.larperscoin'
version = '1.0.9'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.grim.ac/snapshots' }
}

dependencies {
    compileOnly "net.luckperms:api:5.4"
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    compileOnly 'ac.grim.grimac:GrimAPI:1.3.2.1'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar { archiveBaseName = 'LarpersCoin'; archiveVersion = project.version }

sourceSets {
    test { java.exclude 'ca/larperscoin/smp/AntiDuplicationTest.java' }
    antiDuplication {
        java.srcDir 'src/test/java'
        java.include 'ca/larperscoin/smp/AntiDuplicationTest.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('antiDuplicationTest', JavaExec) {
    dependsOn antiDuplicationClasses
    classpath = sourceSets.antiDuplication.runtimeClasspath
    mainClass = 'ca.larperscoin.smp.AntiDuplicationTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'antiDuplicationTest' }
