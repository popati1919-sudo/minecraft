plugins { id 'java' }

group = 'ca.larperscoin'
version = '1.0.9'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.grim.ac/snapshots' }
}

dependencies {
    compileOnly "net.luckperms:api:5.4"
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    compileOnly 'ac.grim.grimac:GrimAPI:1.3.2.1'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar { archiveBaseName = 'LarpersCoin'; archiveVersion = project.version }

tasks.register('antiDuplicationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ca.larperscoin.smp.AntiDuplicationTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'antiDuplicationTest' }
