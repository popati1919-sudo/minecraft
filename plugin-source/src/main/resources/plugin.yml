name: LarpersCoin
version: 0.8.0
main: ca.larperscoin.smp.LarpersCoin
api-version: '26.3'
author: Larpers Coin SMP
description: Plugin SMP LPC: économie, clans, quêtes, commerce et modération.
commands:
  balance:
    description: Affiche ton solde LPC
    aliases: [bal]
    usage: /balance [joueur]
  pay:
    description: Envoie des LPC à un joueur
    usage: /pay <joueur> <montant>
  baltop:
    description: Classement des fortunes LPC
    usage: /baltop
  history:
    description: Historique des transactions LPC
    usage: /history [joueur]
  daily:
    description: Réclame ta récompense quotidienne
    usage: /daily
  bounty:
    description: Place une prime sur un joueur
    usage: /bounty <joueur> <montant>
  eco:
    description: Administration des soldes LPC
    usage: /eco <give|take|set> <joueur> <montant>
    permission: larpers.admin
  lottery:
    description: Loterie LPC
    usage: /lottery <buy|pot|draw>
  clan:
    description: Système de clans
    usage: /clan <create|invite|join|leave|transfer|disband|role|bank|top|allies|level|chest|audit|stats|leaderboard>
  quest:
    description: Quêtes quotidiennes
    aliases: [quests]
    usage: /quests [claim|weekly [claim]]
  quiz:
    description: Quiz de connaissances Minecraft
    usage: /quiz [top]
  shop:
    description: Recherche et achat LPC dans la boutique
    usage: /shop [search <objet>|buy <clé> [quantité]]
  admin:
    description: Menu graphique du staff
    permission: larpers.staff
  vanish:
    description: Invisibilité du staff
    permission: larpers.staff
  invsee:
    description: Voir l'inventaire d'un joueur
    permission: larpers.staff
  freeze:
    description: Immobiliser un joueur
    permission: larpers.staff
  staffchat:
    description: Discussion privée du staff
    permission: larpers.staff
  ah:
    description: Hôtel des ventes
    usage: /ah <list|sell|buy>
  trade:
    description: Échange sécurisé avec double confirmation
    usage: /trade <joueur>|accept|item|money <montant>|confirm|cancel
permissions:
  larpers.staff:
    description: Accès aux outils du staff LPC
    default: op
  larpers.admin:
    description: Administration complète LPC
    default: op
