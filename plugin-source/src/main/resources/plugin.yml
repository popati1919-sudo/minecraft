name: LarpersCoin
version: 1.0.4
main: ca.larperscoin.smp.LarpersCoin
load: STARTUP
api-version: '26.3'
author: Larpers Coin SMP
description: "Plugin SMP LPC: économie, clans, quêtes, commerce, modération et anti-triche."
softdepend: [FastLoginPlus, PlaceholderAPI, floodgate]
commands:
  register:
    description: Crée un compte joueur
    usage: /register <motdepasse> <confirmation>
  login:
    description: Connecte un compte joueur
    usage: /login <motdepasse>
  balance:
    description: Affiche ton solde LPC
    aliases: [bal]
    usage: /balance [joueur]
  pay:
    description: Envoie des LPC à un joueur
    usage: /pay <joueur> <montant>
  baltop:
    description: Classement des fortunes LPC
    usage: /baltop
  history:
    description: Historique des transactions LPC
    usage: /history [joueur]
  daily:
    description: Réclame ta récompense quotidienne
    usage: /daily
  bounty:
    description: Menu des primes et placement sur un joueur
    usage: /bounty [list|<joueur> <montant>]
  eco:
    description: Administration des soldes LPC
    usage: /eco <give|take|set> <joueur> <montant>
    permission: larpers.admin
  lottery:
    description: Menu de loterie LPC; démarrage réservé aux administrateurs
    usage: /lottery [menu|buy [1-10]|start [minutes]|draw]
  clan:
    description: Système de clans
    usage: /clan <create|invite|join|leave|transfer|disband|role|bank|top|allies|level|chest|audit|stats|leaderboard>
  quest:
    description: Quêtes quotidiennes
    aliases: [quests]
    usage: /quests [claim|weekly [claim]]
  quiz:
    description: Quiz de connaissances Minecraft
    usage: /quiz [top]
  shop:
    description: Recherche et achat LPC dans la boutique
    usage: /shop [search <objet>|buy <clé> [quantité]]
  admin:
    description: Menu graphique du staff
    permission: larpers.staff
  vanish:
    description: Invisibilité du staff
    permission: larpers.staff
  invsee:
    description: Voir l'inventaire d'un joueur
    permission: larpers.staff
  freeze:
    description: Immobiliser un joueur
    permission: larpers.staff
  staffchat:
    description: Discussion privée du staff
    permission: larpers.staff
  ah:
    description: Hôtel des ventes avec recherche
    usage: /ah <list|search|sell|buy>
  ac:
    description: "Outils anti-triche LPC (modérateurs: lecture, admins: gestion)"
    usage: /ac <status|alerts|info|top|log|reset|reload>
  trade:
    description: Échange sécurisé avec double confirmation
    usage: /trade <joueur>|accept|item|money <montant>|confirm|cancel
permissions:
  larpers.staff:
    description: Accès aux outils du staff LPC
    default: op
  larpers.anticheat.bypass:
    description: Exempter un joueur de toutes les détections anti-triche
    default: false
  larpers.anticheat.alerts:
    description: Recevoir les alertes anti-triche
    default: op
  larpers.anticheat.use:
    description: Accès aux commandes de consultation anti-triche
    default: op
  larpers.anticheat.mod:
    description: Accès modérateur aux commandes de consultation anti-triche
    default: false
  larpers.admin:
    description: Administration complète LPC
    default: op
