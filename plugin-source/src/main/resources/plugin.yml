name: LarpersCoin
version: 1.0.9
main: ca.larperscoin.smp.LarpersCoin
load: STARTUP
api-version: '26.3'
author: Larry SMP
description: "Plugin Larry SMP: économie, clans, quêtes, hôtel des ventes, modération et anti-triche."
softdepend: [floodgate, GrimAC, LuckPerms]
commands:
  modo:
    description: Entrer ou sortir de la surveillance du SMP
  tp:
    description: Rejoindre un joueur en surveillance
  mute:
    usage: /mute <joueur connecté> [raison]
    permission: larpers.moderate
  unmute:
    usage: /unmute <pseudo>
    permission: larpers.moderate
  banip:
    usage: /banip <joueur ou IP> [raison]
    permission: minecraft.command.ban-ip
  listban:
    usage: /listban [players|ips]
    permission: minecraft.command.banlist
  register:
    description: Crée un compte joueur
    usage: /register <motdepasse>
  login:
    description: Connecte un compte joueur
    usage: /login <motdepasse>
  balance:
    description: Affiche ton solde Larry
    aliases: [bal, money]
    usage: /balance [joueur]
  pay:
    description: Envoie des Larry à un joueur
    usage: /pay <joueur> <montant>
  baltop:
    description: Classement des fortunes Larry
    usage: /baltop
  top:
    description: Ouvre le menu des classements Larry
    usage: /top
  history:
    description: Historique des transactions Larry
    usage: /history [joueur]
  bounty:
    description: Menu des primes et placement sur un joueur
    usage: /bounty [list|<joueur> <montant>]
  eco:
    description: Administration des soldes Larry
    usage: /eco <give|take|set> <joueur> <montant>
    permission: larpers.admin
  lottery:
    description: Menu de loterie Larry; démarrage réservé aux administrateurs
    usage: /lottery [menu|buy <1-1000>|start [minutes]|draw]
  clan:
    description: Système de clans
    usage: /clan <create|invite|join|leave|transfer|disband|role|bank|top|allies|level|chest|audit|stats|leaderboard>
  quest:
    description: Quêtes quotidiennes
    aliases: [quests]
    usage: /quests [claim|weekly [claim]]
  succes:
    description: Menu des succès et récompenses
    aliases: [success]
    usage: /succes
  check:
    description: Affiche la progression du chunk Overworld actuel
    usage: /check
  admin:
    description: Menu adapté au rôle du staff
    permission: larpers.staff
  rank:
    description: Choisir le grade d’un joueur connecté
    permission: larpers.admin
  vanish:
    description: Invisibilité du staff
    permission: larpers.staff
  invsee:
    description: Voir l'inventaire d'un joueur
    permission: larpers.staff
  freeze:
    description: Immobiliser un joueur
    permission: larpers.staff
  staffchat:
    description: Discussion privée du staff
    permission: larpers.staff
  ah:
    description: Hôtel des ventes avec recherche
    usage: /ah <list|search|sell|buy>
  shop:
    description: Boutique Larry avec achats, ventes et marché dynamique
    usage: /shop [search <objet>|buy <objet> [quantité]|sell [quantité]]
  sell:
    description: Interface de vente et vente totale avec confirmation
    usage: /sell [all]
  ac:
    description: "Détection anti-triche Larry sans sanctions automatiques"
    usage: /ac <status|alerts|info|top|log|reset|reload>
  trade:
    description: Échange sécurisé avec double confirmation
    usage: /trade <joueur> | /trade accept | /trade cancel
permissions:
  larpers.moderate:
    default: op
  larpers.modo:
    default: false
    children:
      larpers.staff: true
      larpers.moderate: true
      larpers.anticheat.mod: true
      larpers.anticheat.use: true
      larpers.anticheat.alerts: true
      grim.alerts: true
      minecraft.command.ban: true
      minecraft.command.ban-ip: true
      minecraft.command.banlist: true
      minecraft.command.pardon: true
      minecraft.command.pardon-ip: true
      minecraft.command.kick: true
  larpers.staff:
    description: Accès aux outils du staff Larry
    default: op
  larpers.anticheat.bypass:
    description: Exempter un joueur de toutes les détections anti-triche
    default: false
  larpers.anticheat.alerts:
    description: Recevoir les alertes anti-triche
    default: op
  larpers.anticheat.use:
    description: Accès aux commandes de consultation anti-triche
    default: op
  larpers.anticheat.mod:
    description: Accès modérateur aux commandes de consultation anti-triche
    default: false
  larpers.admin:
    children:
      larpers.modo: true
    description: Administration complète Larry
    default: op
